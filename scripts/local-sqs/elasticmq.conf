# ElasticMQ config -- a local, SQS-API-compatible queue for development only.
# Lets docker-compose run the full app (including the notification flow)
# without any real AWS credentials. Production uses real Amazon SQS.
include classpath("application.conf")

node-address {
    protocol = http
    host = "*"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

queues {
    notifications {
        defaultVisibilityTimeout = 30 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
    }
}
