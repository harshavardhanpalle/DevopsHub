# Simple API gateway / routing layer.
#
# One public entry point that fans out to the 4 microservices by logical
# route, using Docker service names (never localhost) for upstream
# addresses. This intentionally stays plain nginx -- no Kong, no extra
# framework -- per the assignment's "keep the gateway simple" rule.

server {
    listen 8080;
    server_name _;

    # /api/auth/*  and /api/users/*  -> user-service
    location /api/auth/ {
        proxy_pass http://user-service:8001/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/users/ {
        proxy_pass http://user-service:8001/api/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # /api/articles/* -> blog-service
    location /api/articles {
        proxy_pass http://blog-service:8002/api/articles;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # /api/categories/* -> category-service
    location /api/categories {
        proxy_pass http://category-service:8003/api/categories;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # /api/notifications/* -> notification-service
    location /api/notifications {
        proxy_pass http://notification-service:8004/api/notifications;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Gateway's own liveness check (does not fan out to backends).
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }
}
