server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/html;
    gzip_min_length 256;

    # Reverse-proxy API calls to the gateway, using the Docker service name
    # (never localhost) -- keeps the browser talking to a single origin, so
    # no CORS configuration is needed on the frontend side. Added for
    # DevOpsHub backend integration; everything else in this file is
    # unchanged from the original static-site config.
    location /api/ {
        proxy_pass http://gateway.devopshub.local:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /index.html;
}
